name: Publish Docker image

# main is the one line that ships (since 1.0.5): every push to it is built as :experimental, and a
# v* tag on it is a release. player-spike builds its own :player; other branches build nothing
# unless run by hand (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      # the phone player's trial build, for a week on James's iPhone before the multi-user work
      # goes on top of it - its own tag, so neither :latest nor :experimental moves
      - 'player-spike'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # An image is only built from code whose tests pass. Before this, a tag published whatever it
  # pointed at, and :latest moved with it.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # docker tags must be lowercase; the org name isn't
          image="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version}"

            # :latest only ever moves for a real release. Never a prerelease (1.0.0-rc1),
            # never a branch build - otherwise anyone pulling :latest silently gets
            # unfinished code, which is the whole reason experimental has its own tag.
            if [[ "${version}" != *-* ]]; then
              tags="${tags}"$'\n'"${image}:latest"
            fi

          #? still called :experimental - it was the experimental branch's until 1.0.5, and a stack
          #? pointed at it keeps getting the newest code without being edited
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags="${image}:experimental"

          elif [[ "${GITHUB_REF}" == refs/heads/player-spike ]]; then
            tags="${image}:player"

          else
            tags="${image}:$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          fi

          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
