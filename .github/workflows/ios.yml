name: iOS

# The iPhone app (ios/, notes/ios.md): DeadwaxKit's tests on Linux and on macOS, and an UNSIGNED
# device build of the app - the only place the Apple-only code (SwiftUI, AVFAudio, MediaPlayer) is
# compiled before James builds it, since nothing on Linux can. Signing happens only on James's Mac
# (ios/scripts/install.sh), which asks this workflow's result for the commit it builds.
#
# Only for commits that touch the app: the server's own checks are tests.yml's (which also runs
# tests/test_ios_*.py - the app's contract with the server's routes and the install helper).
# `branches` beside `paths` keeps tags out: GitHub never applies a paths filter to a tag push, so
# without it every server release tag (v*) would run this too.
on:
  push:
    branches: ['**']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DeadwaxCore built and tested with Swift for Linux, as on tokay-gecko (ios/scripts/check-linux.sh).
  # DeadwaxAudio compiles to nothing here: every file of it is inside `#if canImport(AVFAudio)`.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      # the download store's SQLite (Sources/CSQLite): the image has the library, not its header
      - name: SQLite's header
        run: apt-get update -q && apt-get install -y -q libsqlite3-dev
      - name: DeadwaxKit
        run: swift test --package-path ios/DeadwaxKit

  # The .pbxproj, the scheme, the xcconfigs, Info.plist and the icons, read without Xcode; no asset
  # catalog or storyboard anywhere (they need a Simulator runtime James's Mac doesn't have).
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 ios/scripts/check_project.py
      - name: the scripts parse
        run: for script in ios/scripts/*.sh; do bash -n "$script"; done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # printed so the label and the Xcode can be pinned once seen (the plan's risk R15)
      - name: Xcode
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          ls -d /Applications/Xcode*.app || true

      # Core again, and the engine rendered offline, sample by sample: a join is the two songs end to
      # end, a 24-bit file decodes exactly, a stream decodes what the file does. This run and the next each
      # print one line, "AVAudioPlayerNode taking a buffer, measured": how late this runner's nodes take a
      # buffer, against the engine's offline settle, and how late it lets a 10 ms sleep run - a print, never
      # a check (BufferTakeMeasuredTests.swift; how to read it: notes/ios.md "A node's buffers, taken late").
      # DeadwaxTurntableTests draws the turntable with CALayer.render(in:) in each state of turntable.md 2.8 at
      # the iPhone 16's and the SE's plinth, at 3x, and writes the PNGs to TURNTABLE_RENDERS (uploaded below).
      - name: DeadwaxKit, with the engine's offline renders
        env:
          TURNTABLE_RENDERS: ${{ runner.temp }}/turntable-renders
        run: swift test --package-path ios/DeadwaxKit

      # The turntable's renders, to look at beside the web's screenshots of the same states (turntable.md 7.3)
      - name: The turntable's renders
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: turntable-renders
          path: ${{ runner.temp }}/turntable-renders
          if-no-files-found: warn

      # The engine's renders again with every buffer reaching its node 10 ms late - what this runner's
      # AVAudioPlayerNode did at 70cbef6 and 307384f, held off longer (notes/ios.md "A node's buffers, taken
      # late"): the engine's offline settle must cover it with room to spare, whatever this run's own timing.
      # At 09781a5 this failed 12 of 87 with the settle at 30 ms. The hook's 10 ms was a Thread.sleep, which
      # the system lets run late where it coalesces timers, and so was the settle's wait. A Mac under
      # `taskpolicy -b` fails 6-9 of those 12 the same way - but -b also fails a test this runner passed
      # (playAfterAPauseWaitsForThisRunsFirstRender), so it is harsher than this runner, and coalescing here is
      # likely, not seen. Both waits are on a strict timer now and the settle is 100 ms, 90 ms over the lag -
      # under load the margin is what carries it; the measured line says how much of it this runner uses.
      # (At 10 ms the old 10 ms settle failed most of the suite; at 0.5 ms a 2 ms settle passed.)
      - name: The engine's offline renders, its buffers taken late
        if: ${{ !cancelled() }}
        env:
          DEADWAX_TEST_SCHEDULE_LAG: "0.010"
        run: swift test --package-path ios/DeadwaxKit --filter DeadwaxAudioTests

      # The EQ's render in the build that ships, release (notes/ios-specs/eq.md 1.5, 1.7 tests 5 and 8-10): its
      # render block called as the AU framework calls it, 10,000 times, with not one allocation or free on that
      # thread (the allocation hook first proves itself with a canary); the heaviest EQ - 74 sections a channel at
      # 192 kHz, crossfading every block - its median block under 15% of a block's time (slice 2's review: a shared
      # runner's pauses move a mean, not a median); 5 minutes of silence no dearer than noise; a
      # block of 4,097 frames refused. A debug build prints these and bounds none of them.
      - name: The EQ's render, release build
        if: ${{ !cancelled() }}
        run: swift test -c release --package-path ios/DeadwaxKit --filter EQRealTimeTests

      # The record's render in the build that ships, release (notes/ios-specs/turntable.md 4.3, 7.2): the deck
      # engine's render entry called 10,000 times over every message kind and two window swaps, and 1,000 blocks
      # through AVAudioEngine's own real-time manual render, with not one allocation or free on that thread - the
      # hook's canary seen first. A debug build's unspecialised generics allocate; it prints and bounds nothing.
      - name: The record's render, release build
        if: ${{ !cancelled() }}
        run: swift test -c release --package-path ios/DeadwaxKit --filter DeckRealTimeTests

      # A test process that crashes can end the step with its last lines unprinted: macOS's crash
      # report says where (the faulting thread's stack, and an exception's reason)
      - name: Crash reports, if the tests died
        if: failure()
        run: |
          for dir in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            ls -lt "$dir" 2>/dev/null | head -20 || true
            find "$dir" -maxdepth 1 -newer ios/DeadwaxKit/Package.swift \
              \( -name '*Deadwax*' -o -name '*xctest*' -o -name '*swiftpm*' \) 2>/dev/null |
              while read -r report; do echo "=== $report"; head -c 60000 "$report"; echo; done
          done

      # GitHub's macOS runners come with iOS Simulator runtimes, which James's Mac doesn't have. They are
      # printed, and left alone. This step used to delete them, so that a build tool needing one (actool,
      # ibtool - the plan's R2) would fail here as it would there. But `simctl runtime delete all` only marks
      # them for deletion and returns: the list after it still showed every runtime, and the deletion finished
      # in the background some seconds later - sometimes while the next step was resolving its destination,
      # which then failed with "iOS 26.5 is not installed" (2026-11-12, run 43318108181 and earlier). R2 is
      # settled where it matters: install.sh built and installed on James's Mac with no Simulator runtime at
      # any point (Phase 0's check 1, 2026-11-10), and check_project.py refuses the asset catalogs,
      # storyboards and xibs that would need one.
      # The app's build runs whether or not a test failed (the job fails either way), so one run shows
      # both; the checks on what it made only when it built.
      - name: The Simulator runtimes this runner has (never used)
        if: ${{ !cancelled() }}
        run: xcrun simctl list runtimes || true

      - name: The app, an unsigned device build
        id: build
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -project ios/Deadwax.xcodeproj -scheme Deadwax -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: What the build made
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          app=build/Build/Products/Release-iphoneos/Deadwax.app
          ls -la "$app"
          plutil -p "$app/Info.plist"
          # one test a line: bash -e doesn't stop for a failure inside an && list
          test -f "$app/AppIcon60x60@2x.png"
          test -f "$app/AppIcon60x60@3x.png"
          test ! -e "$app/Assets.car"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = net.lizardlounge.deadwax
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")" = 0.5
          test "$(plutil -extract UIBackgroundModes.0 raw "$app/Info.plist")" = audio
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw "$app/Info.plist")" = true
          python3 ios/scripts/check_project.py
