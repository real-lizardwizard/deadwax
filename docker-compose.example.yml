services:
  deadwax:
    image: ghcr.io/real-lizardwizard/deadwax:latest  # the newest release; :2.0.0 pins one exactly; :experimental is main, rebuilt on every push
    container_name: deadwax
    restart: unless-stopped
    env_file:  # .env beside this file, for slskd's key, Navidrome's password, PUID/PGID and logins - start from .env.example
      - path: .env  # every variable: docs/configuration.md#environment-variables
        required: false  # no .env, or an empty one, is fine; this form needs Docker Compose 2.24 or newer
    volumes:
      - /path/to/slskd/downloads:/downloads  # the SAME folder slskd writes its finished downloads to - the likeliest first-run problem if not
      #- /path/to/slskd/incomplete:/incomplete  # optional, slskd's incomplete folder: then set SLSKD_INCOMPLETE_PATH to /incomplete in Server settings (Library)
      - /path/to/music:/music  # your library, where organized albums are filed - the folder Navidrome reads too
      - /path/to/deadwax/config:/config  # the database (settings saved in the app included) and MusicBrainz's saved answers
      #- /path/to/fast/disk/deadwax-cache:/cache  # optional, an SSD for the caches: then set PLAYER_CACHE_PATH (Library) and MUSICBRAINZ_CACHE_PATH (Connections) to /cache in Server settings; writable by PUID/PGID; leave out of backups
    ports:
      - "8080:8080"  # change the left side to expose another port on the host; then open http://<host>:8080 and set the rest in Server settings
