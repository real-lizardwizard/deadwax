services:
  deadwax:
    # :latest is the newest release (1.0.0 onward: slskd direct, no Lidarr), and moves only when
    # one is tagged; use :1.0.4 to pin exactly. :experimental is rebuilt from main on every push
    # and moves under you. Only :0.2.1 and older are the original Lidarr-based version, and
    # those will NOT understand the settings below.
    image: ghcr.io/real-lizardwizard/deadwax:latest
    container_name: deadwax
    restart: unless-stopped

    # ---------------------------------------------------------------------------------
    # There are two places to configure deadwax, and you can use either or both:
    #
    #   env_file      the .env file next to this one. Good for the things you'd rather not
    #                 have sitting in a file you might paste into a forum post - your slskd
    #                 API key in particular.
    #   environment   the block below. Good for keeping everything about this container in
    #                 one file, which is what you want when Komodo or similar manages the stack.
    #
    # If a setting appears in both, `environment:` wins. That is a deliberate feature and
    # not an accident - but see the warning on the block below before using it.
    # ---------------------------------------------------------------------------------
    env_file:
      # Delete these two lines if you'd rather configure everything in `environment:` below -
      # compose treats a missing env_file as a hard error, so an unused one has to go rather
      # than just sit there empty.
      - .env

    environment:
      # Fixed container-internal paths. These match the mounts below and aren't yours to
      # change in .env - change the left-hand side of the volume instead.
      - SLSKD_DOWNLOAD_PATH=/downloads
      - LIBRARY_PATH=/music
      - DB_PATH=/config/deadwax.db
      #
      # Optional. slskd's INCOMPLETE folder, which is a different directory from the completed
      # downloads above. Set it (and mount it below) and cancelling a download also deletes the
      # half-finished file it left behind, and the empty folders slskd leaves in there after
      # every finished download are cleared every ten minutes (only ever EMPTY ones - a
      # partial file and the folders holding it are never touched). Leave it out and both
      # stay, which is slskd's own behaviour - it keeps partials so a retried download can
      # RESUME from them rather than starting over, so one is only junk for a transfer you
      # meant to abandon.
      #- SLSKD_INCOMPLETE_PATH=/incomplete
      #
      # Optional. Where the player keeps the FLAC songs it repackages as MP4s for Safari and
      # iPhones, whose seeks only land where you asked in an MP4. Left out, it is the container's
      # temporary space, which starts empty with every new container. Mount a folder below and
      # point this at it to keep the cache there - on a fast disk (an SSD) if you have one.
      # deadwax makes a private folder of its own inside it, deadwax-player, and touches nothing
      # else there. It is only a cache: nothing in it needs backing up, and deleting it is always
      # safe. PLAYER_CACHE_MB is the most it holds (64 to 1048576; 1024 is a few albums), the songs
      # played longest ago going first. A disk short of space just means Safari gets the FLAC.
      #- PLAYER_CACHE_PATH=/cache
      #- PLAYER_CACHE_MB=1024

      # ----- uncomment to configure deadwax here instead of in .env -----
      #
      # WRITE LITERAL VALUES, as shown. Do NOT write `SLSKD_URL=${SLSKD_URL}`: compose
      # interpolates that from its OWN environment, and when that lookup comes back empty it
      # sets the variable to an empty string - which still counts as set, still beats .env,
      # and leaves you with slskd unconfigured and a .env line that looks perfectly correct.
      # deadwax now says so explicitly in its log if this happens to you, but it is much
      # easier to just not do it.
      #
      # The URL needs the scheme, and must be reachable FROM THIS CONTAINER - if slskd is
      # another container on the same docker network, that's its service name and internal
      # port (http://slskd:5030), not the address you use from your browser.
      #- SLSKD_URL=http://slskd:5030
      #- SLSKD_APIKEY=your-slskd-api-key
      #
      # Your email address. MusicBrainz asks every app for a contact, and deadwax writes the
      # rest of its user agent itself, version included: deadwax/<version> ( you@example.com ).
      # An older MUSICBRAINZ_USERAGENT still works - its contact is used - but this replaces it.
      #- MUSICBRAINZ_EMAIL=you@example.com
      #
      # 250 | 500 | 1200 | full - how big a cover deadwax saves from the Cover Art Archive.
      # full is the original upload, often several MB. Also changeable in the settings tab.
      #- COVER_ART_SIZE=500
      #
      # on | off - look up lyrics on LRCLIB for each album as it is filed, saved as a .lrc
      # beside every track. Only adds files; a .lrc already there is never replaced.
      #- FETCH_LYRICS=on
      #
      # milliseconds to move synced lyrics earlier (negative: later). LRCLIB's timings trail the
      # singing a little; if lines land a beat late in your player, try 300.
      #- LYRICS_LEAD_MS=0
      #
      # on | off - name a regional pressing's folder by its country: Dummy (1994) [GB].
      # Off by default; different pressings still get their own folders, by catalogue number.
      #- COUNTRY_IN_FOLDER=off
      #
      # how an album folder is named, e.g. "{year} - {album} [{edition}]". Unset is the default,
      # "{album} ({year}) [{edition}]"; the artist folder above it is always the artist.
      #- ALBUM_FOLDER_TEMPLATE={album} ({year}) [{edition}]
      #
      # on | off - move a failed download to the next peer from the list you picked it from, by
      # itself. Off by default; "Try next peer" on the download works either way.
      #- AUTO_RETRY_PEER=off
      #
      # seconds each Soulseek search listens for answers (3-60): longer finds more peers
      #- SLSKD_SEARCH_TIMEOUT=8
      #
      # seconds between writing an album's new tags and renaming its folder, when applying a
      # release changes both, so Navidrome keeps its plays and favourites. With Navidrome set up
      # below, deadwax asks it when it has scanned instead, and this only has to be more than 0.
      # 0 renames straight away.
      #- RETAG_RENAME_WAIT=20
      #
      # Optional - the player at /player/, which plays your library from Navidrome. deadwax
      # keeps this login and passes the player's requests on, so a phone only ever needs to
      # reach deadwax. The URL is Navidrome's address FROM THIS CONTAINER, like slskd's, plus
      # Navidrome's base path if it has one (ND_BASEPATH): http://navidrome:4533/music. A
      # non-admin account of your own is enough. The password is better kept in .env, like the
      # slskd key.
      #- NAVIDROME_URL=http://navidrome:4533
      #- NAVIDROME_USER=your-navidrome-user
      #- NAVIDROME_PASSWORD=your-navidrome-password
      #
      # Only behind a reverse proxy that rewrites the Host header: the address you open deadwax
      # at, with the scheme (comma-separated for several). Changes another website sends are
      # refused, and behind such a proxy deadwax's own page - and the player's plays - look like
      # another website. Environment only: the settings tab can't set it, since it guards that
      # tab's own save.
      #- TRUSTED_ORIGINS=https://music.example.com
      #
      # off | dry_run | copy | move. Starts at dry_run on purpose - organizing is the only
      # thing here that writes to your filesystem, so check the event log looks right before
      # switching to copy or move.
      #- ORGANIZE_MODE=dry_run
      #
      # match these to slskd and your *arr containers so files end up consistently owned
      #- PUID=1000
      #- PGID=1000

    volumes:
      # deadwax needs to SEE slskd's finished downloads to organize them, so this must be
      # the same underlying directory slskd writes to. If the two containers disagree about
      # this path, organizing silently finds nothing - it's the most likely first-run problem.
      - /path/to/slskd/downloads:/downloads
      # only needed if you set SLSKD_INCOMPLETE_PATH above - slskd's incomplete folder, the
      # same one its `directories.incomplete` setting points at
      #- /path/to/slskd/incomplete:/incomplete
      # where organized albums get filed
      - /path/to/music:/music
      # holds the database that remembers which download belongs to which release
      - /path/to/deadwax/config:/config
      # only needed if you set PLAYER_CACHE_PATH above - put it on a fast disk (an SSD), writable
      # by PUID/PGID. It is only a cache: leave it out of your backups, and delete it when you like
      #- /path/to/fast/disk/deadwax-cache:/cache

    ports:
      - "8080:8080"
    # this exposes the port on your host, to change it modify xxxx:8080, xxxx being
    # the port you want to expose. A stack manager like Komodo reads it straight out of this file.
