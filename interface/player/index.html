<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the page draw under the notch and the home bar; player.css keeps
         anything you touch out of them with the safe-area insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>deadwax</title>
    <meta name="theme-color" content="#000000">
    <!-- Added to an iPhone's home screen, this opens full screen like an app. The manifest says so
         for iOS 16.4 and later; the apple- meta tags say it for anything older. -->
    <link rel="manifest" href="/player/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="deadwax">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- iOS takes the home screen icon from here, not the manifest, and it has to be a PNG -->
    <link rel="apple-touch-icon" href="/player/icon-180.png">
    <link rel="icon" href="/player/icon.svg" type="image/svg+xml">
    <!-- the one font file nearly every screen needs, asked for at once rather than when the stylesheets
         have been read (the other scripts' files are fetched only when a name needs them) -->
    <link rel="preload" href="/styles/font/noto-sans/noto-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- the tokens every stylesheet below reads - linked here, not @import-ed, so it loads beside them -->
    <link rel="stylesheet" href="/styles/theme.css">
    <link rel="stylesheet" href="/player/player.css">
    <!-- the app's own chrome - the tab bar, Home, You - after the player's, whose mechanics it builds on -->
    <link rel="stylesheet" href="/player/app.css">
    <!-- the desktop's frame (sidebar, player bar, side panels), from 1024px wide only - last, over both -->
    <link rel="stylesheet" href="/player/app-desktop.css">
</head>
<body>
    <div id="player-root"></div>
    <!-- built from ui/src/player/main.tsx (the app, ui/src/app/) by `npm run build` - see ui/vite.config.ts -->
    <script type="module" src="/dist/deadwax-player.js"></script>
</body>
</html>
